<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fecha Especial</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b2545; --blue:#3d8bfd; --sky:#a9d3ff; --mint:#9be3c0; --green:#2fb67c; --ink:#14213d;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Quicksand',system-ui,sans-serif;color:var(--ink);overflow:hidden;
  background:linear-gradient(135deg,#e3f1ff,#ffffff,#dff8ec,#cfe6ff);
  background-size:400% 400%;animation:bg 16s ease infinite;
}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* ---------- Corazones de fondo ---------- */
#hearts,#burst{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#hearts{z-index:0}
#burst{z-index:3}
.heart{position:absolute;bottom:-50px;opacity:0;animation:floatUp linear forwards}
@keyframes floatUp{
  0%{transform:translate(0,0) rotate(var(--r0));opacity:0}
  10%{opacity:var(--o)}
  90%{opacity:var(--o)}
  100%{transform:translate(var(--dx),-118vh) rotate(var(--r1));opacity:0}
}
.pop-heart{position:absolute;margin:-10px 0 0 -10px;opacity:0;animation:burst 1.5s ease-out both}
@keyframes burst{
  0%{transform:translate(0,0) scale(.2);opacity:1}
  100%{transform:translate(var(--bx),var(--by)) scale(1.1) rotate(25deg);opacity:0}
}

/* ---------- Escenario ---------- */
.stage{position:fixed;inset:0;z-index:1;display:grid;overflow-y:auto;padding:16px}
.stage>*{grid-area:1/1;margin:auto}

/* ---------- Tarjeta del teclado ---------- */
.card{
  width:min(340px,92vw);background:rgba(255,255,255,.92);border-radius:30px;
  padding:26px 22px 24px;text-align:center;position:relative;
  box-shadow:0 20px 60px rgba(61,139,253,.25),0 0 0 6px rgba(255,255,255,.55);
  backdrop-filter:blur(6px);
  transition:opacity .9s,transform .9s,filter .9s,visibility 0s;
}
.card.hide{
  opacity:0;transform:scale(.88) translateY(-10px);filter:blur(8px);
  pointer-events:none;visibility:hidden;
  transition:opacity .9s,transform .9s,filter .9s,visibility 0s .9s;
}
.card-heart{width:36px;height:36px;margin:-46px auto 6px;color:var(--blue);
  filter:drop-shadow(0 6px 10px rgba(61,139,253,.45));animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.title{font-family:'Dancing Script',cursive;font-size:30px;font-weight:700;color:var(--navy);
  margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.title svg{width:16px;height:16px;color:var(--blue)}
.title svg:last-child{color:var(--green)}

.display{
  height:54px;border-radius:16px;background:#eef6ff;border:1px solid #cfe3ff;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:700;letter-spacing:2px;color:var(--navy);margin-bottom:18px;
  transition:background .5s,color .3s;
}
.display.ph{color:#9db8d8;font-weight:500;font-size:17px;letter-spacing:1.5px}
.display.err{color:#6b86a8;font-size:16px;letter-spacing:.5px;animation:shake .5s}
.display.ok{background:linear-gradient(135deg,#dff8ec,#dcecff);font-size:24px;animation:pulse .9s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pulse{0%{transform:scale(.96)}50%{transform:scale(1.05)}100%{transform:scale(1)}}

.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 14px;justify-items:center}
.key{
  width:100%;max-width:62px;aspect-ratio:1;border:none;border-radius:50%;background:#fff;color:#4b7bbf;
  font:600 20px 'Quicksand',sans-serif;cursor:pointer;
  box-shadow:0 4px 12px rgba(61,139,253,.14),inset 0 0 0 1px #eaf2ff;
  transition:transform .12s,box-shadow .12s;display:grid;place-items:center;
}
.key:hover{box-shadow:0 6px 16px rgba(61,139,253,.24),inset 0 0 0 1px #d9e9ff}
.key:active{transform:scale(.9)}
.key.del{font-size:12px;color:#7b93b3}
.key.go{background:linear-gradient(135deg,#5aa8ff,#2f6fe0);color:#fff;box-shadow:0 8px 18px rgba(47,111,224,.4)}
.key.go svg{width:26px;height:26px}
.hint{min-height:18px;margin-top:14px;font-size:12.5px;color:#6b86a8;line-height:1.4}

/* ---------- Escena del ramo ---------- */
.scene{
  width:min(440px,100%);text-align:center;padding:10px 0 24px;
  opacity:0;visibility:hidden;transform:translateY(20px);
  transition:opacity 1s,transform 1s,visibility 0s 1s;
}
.scene.show{opacity:1;visibility:visible;transform:none;transition:opacity 1s .2s,transform 1s .2s}
.scene h2{font-family:'Dancing Script',cursive;font-size:clamp(32px,9vw,44px);color:var(--navy);margin-bottom:2px}
.bouquet{width:min(78vw,340px);height:auto;display:block;margin:0 auto;overflow:visible}
.letter{
  font-size:16px;line-height:1.6;color:var(--navy);max-width:360px;margin:12px auto 0;
  white-space:pre-line;padding:0 8px;text-align:center;
}
.again{
  margin-top:8px;border:none;background:rgba(255,255,255,.75);color:#4b7bbf;font:600 13px 'Quicksand',sans-serif;
  padding:8px 16px;border-radius:999px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .8s;
  box-shadow:0 4px 12px rgba(61,139,253,.15)
}
.again.on{opacity:1;pointer-events:auto}

/* ---------- Botón de música ---------- */
.sound{
  position:fixed;right:16px;bottom:16px;z-index:5;width:44px;height:44px;border:none;border-radius:50%;
  background:rgba(255,255,255,.85);color:#3d8bfd;display:grid;place-items:center;cursor:pointer;
  box-shadow:0 6px 16px rgba(61,139,253,.25);backdrop-filter:blur(6px);transition:transform .15s,color .2s;
}
.sound[hidden]{display:none}
.sound:active{transform:scale(.92)}
.sound svg{width:22px;height:22px}
.sound .slash{
  position:absolute;width:28px;height:2.5px;border-radius:2px;background:#9db8d8;
  transform:rotate(-45deg) scaleX(0);transition:transform .2s;
}
.sound.off{color:#9db8d8}
.sound.off .slash{transform:rotate(-45deg) scaleX(1)}

/* animaciones del ramo */
.stem{stroke-dasharray:1;stroke-dashoffset:1;animation:grow 1.2s ease forwards}
@keyframes grow{to{stroke-dashoffset:0}}
.pop{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:bloom 1s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes bloom{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.rise{animation:rise 1s ease both}
@keyframes rise{from{transform:translateY(70px);opacity:0}to{transform:none;opacity:1}}
.sway{transform-origin:200px 470px;animation:sway 6s ease-in-out 4s infinite}
@keyframes sway{0%,100%{transform:rotate(-1.1deg)}50%{transform:rotate(1.1deg)}}
.spark{transform-box:fill-box;transform-origin:center;animation:twinkle 2.6s ease-in-out infinite;opacity:0}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.1)}}

@media (prefers-reduced-motion:reduce){
  body{animation:none}
  .sway{animation:none}
}
</style>
</head>
<body>

<!-- símbolo del corazón reutilizable -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="h" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.2 5c2 0 3.3 1.1 5.8 3.4C14.5 6.1 15.8 5 17.8 5 21 5 23.1 8.4 21.6 11.8 19.5 16.4 12 21 12 21z"/></symbol>
</svg>

<div id="hearts"></div>
<div id="burst"></div>

<button class="sound" id="sound" aria-label="Silenciar música" hidden>
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 3v10.55A4 4 0 1 0 11 17V7h6V3H9z"/></svg>
  <span class="slash"></span>
</button>

<main class="stage">
  <section class="card" id="card">
    <svg class="card-heart" viewBox="0 0 24 24" fill="currentColor"><use href="#h"/></svg>
    <div class="title">
      <svg viewBox="0 0 24 24" fill="currentColor"><use href="#h"/></svg>
      Fecha Especial
      <svg viewBox="0 0 24 24" fill="currentColor"><use href="#h"/></svg>
    </div>
    <div class="display ph" id="display" aria-live="polite">DD / MM / AAAA</div>
    <div class="keys" id="keys">
      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button>
      <button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button>
      <button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button>
      <button class="key del" data-k="del" aria-label="Borrar">Borrar</button>
      <button class="key" data-k="0">0</button>
      <button class="key go" data-k="go" aria-label="Confirmar"><svg viewBox="0 0 24 24" fill="currentColor"><use href="#h"/></svg></button>
    </div>
    <div class="hint" id="hint"></div>
  </section>

  <section class="scene" id="scene">
    <h2 id="para"></h2>
    <svg id="bq" class="bouquet" viewBox="0 0 400 500" aria-label="Ramo de flores"></svg>
    <p class="letter" id="letter"></p>
    <button class="again" id="again">↺ Volver a ver</button>
  </section>
</main>

<script>
/* =====================================================
   PERSONALIZA AQUÍ
   ===================================================== */
const CONFIG = {
  nombre: "Mi amor",                              // Su nombre o apodo
  fecha: { dia: 3, mes: 6, anio: 2026 },          // Fecha correcta
  pista: "Pista: es nuestra fecha especial. Escríbela como día, mes y año 💙",
  mensajeFinal:
`Aquí estamos, ya son 4 meses que parece que fue mucho tiempo más, de seguir conociéndote, queriéndote, amándote como el primer día. Mi gruñona favorita, estar a tu lado le trae paz a mi mundo; el estar descansando entre tus brazos hace que no quiera despegarme nunca. Quiero ser ese refugio para cuando sientas que nadie esté de tu lado; seré tu medicina, tu alivio, tu lugar seguro.

Gracias por tu cariño, por las risas y por hacer mis días más felices.

Feliz aniversario, o mejor dicho, mesesario, jajaja

TE AMO, mi chiquita`,
  musica: "cancion.mp3",                          // Archivo de la canción, en la misma carpeta que este HTML ("" = sin música)
  musicaInicio: 0,                                // Segundo donde empieza (ej. 45 para ir directo al coro)
  volumen: 0.6                                    // De 0 a 1
};
/* ===================================================== */

const pad = n => String(n).padStart(2, '0');
const {dia, mes, anio} = CONFIG.fecha;
const OK = [pad(dia)+pad(mes)+anio, pad(dia)+pad(mes)+String(anio).slice(2), pad(dia)+pad(mes)];

const $ = id => document.getElementById(id);
const card=$('card'), display=$('display'), hint=$('hint'), scene=$('scene'),
      bq=$('bq'), letter=$('letter'), again=$('again'), layer=$('hearts'), burstLayer=$('burst');
$('para').textContent = `Para ti, ${CONFIG.nombre} 💙`;

let digits='', busy=false, attempts=0, tw=null;

/* ---------- Música de fondo ---------- */
const soundBtn=$('sound');
let audio=null, soundOn=true, started=false, fadeT=null;
function fadeTo(v,done){
  clearInterval(fadeT);
  fadeT=setInterval(()=>{
    if(!audio){ clearInterval(fadeT); return; }
    const d=v-audio.volume;
    if(Math.abs(d)<.03){ audio.volume=v; clearInterval(fadeT); done&&done(); return; }
    audio.volume=Math.min(1,Math.max(0,audio.volume+Math.sign(d)*.03));
  },60);
}
if(CONFIG.musica){
  audio=new Audio(CONFIG.musica);
  audio.loop=true; audio.volume=0; audio.preload='auto';
  audio.addEventListener('error',()=>{ audio=null; soundBtn.hidden=true; }); // si falta el archivo, no pasa nada
  soundBtn.hidden=false;
}
function startMusic(){
  if(!audio||started||!soundOn) return;
  started=true;
  try{ if(CONFIG.musicaInicio) audio.currentTime=CONFIG.musicaInicio; }catch(e){}
  audio.play().then(()=>fadeTo(CONFIG.volumen)).catch(()=>{ started=false; });
}
soundBtn.addEventListener('click',()=>{
  if(!audio) return;
  soundOn=!soundOn;
  soundBtn.classList.toggle('off',!soundOn);
  soundBtn.setAttribute('aria-label',soundOn?'Silenciar música':'Activar música');
  if(soundOn){ started=true; audio.play().then(()=>fadeTo(CONFIG.volumen)).catch(()=>{}); }
  else fadeTo(0,()=>audio&&audio.pause());
});
// Los navegadores bloquean el audio hasta que la persona toca algo: arranca con su primer toque
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,startMusic));

/* ---------- Entrada de la fecha ---------- */
function fmt(d){
  return [d.slice(0,2), d.slice(2,4), d.slice(4)].filter(Boolean).join(' / ');
}
function render(){
  display.classList.remove('err');
  if(!digits){ display.className='display ph'; display.textContent='DD / MM / AAAA'; }
  else { display.className='display'; display.textContent=fmt(digits); }
}
function press(k){
  if(busy) return;
  if(k==='del'){ digits=digits.slice(0,-1); render(); return; }
  if(k==='go'){ submit(); return; }
  if(digits.length>=8) return;
  digits+=k; render();
  if(digits.length===8) setTimeout(submit,200);
}
function submit(){
  if(busy || !digits) return;
  OK.includes(digits) ? success() : fail();
}
function fail(){
  busy=true; attempts++;
  display.className='display err';
  display.textContent='Esa no es… inténtalo de nuevo 💙';
  if(attempts>=2) hint.textContent=CONFIG.pista;
  setTimeout(()=>{ digits=''; busy=false; render(); },1300);
}
function success(){
  busy=true;
  display.className='display ok';
  display.textContent='¡Te Amo! 💙';
  burst();
  setTimeout(()=>{
    card.classList.add('hide');
    buildBouquet();
    scene.classList.add('show');
    typeLetter(CONFIG.mensajeFinal);
  },2600);
}

$('keys').addEventListener('click',e=>{
  const b=e.target.closest('.key'); if(b) press(b.dataset.k);
});
document.addEventListener('keydown',e=>{
  if(/^[0-9]$/.test(e.key)) press(e.key);
  else if(e.key==='Backspace'||e.key==='Delete') press('del');
  else if(e.key==='Enter') press('go');
});

/* ---------- Corazones flotantes ---------- */
const PAL=['#5aa2ff','#8ec5ff','#bcdcff','#ffffff','#7fdcb0','#3d8bfd'];
const HEART='<svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor"><use href="#h"/></svg>';
function spawnHeart(initial){
  if(document.hidden) return;
  const s=14+Math.random()*30, dur=9+Math.random()*9;
  const el=document.createElement('div');
  el.className='heart';
  el.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;color:${PAL[Math.floor(Math.random()*PAL.length)]};`+
    `--o:${(.25+Math.random()*.4).toFixed(2)};--dx:${(Math.random()*120-60).toFixed(0)}px;`+
    `--r0:${(Math.random()*40-20).toFixed(0)}deg;--r1:${(Math.random()*80-40).toFixed(0)}deg;`+
    `animation-duration:${dur}s;`+(initial?`animation-delay:-${(Math.random()*dur).toFixed(1)}s;`:'')+
    (Math.random()<.3?'filter:blur(1.5px);':'');
  el.innerHTML=HEART;
  layer.appendChild(el);
  el.addEventListener('animationend',()=>el.remove());
}
for(let i=0;i<16;i++) spawnHeart(true);
setInterval(spawnHeart,480);

function burst(){
  const r=card.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  for(let i=0;i<46;i++){
    const a=Math.random()*Math.PI*2, d=90+Math.random()*Math.min(innerWidth,innerHeight)*.55, s=12+Math.random()*22;
    const el=document.createElement('div');
    el.className='pop-heart';
    el.style.cssText=`left:${cx}px;top:${cy}px;width:${s}px;height:${s}px;color:${PAL[i%PAL.length]};`+
      `--bx:${(Math.cos(a)*d).toFixed(0)}px;--by:${(Math.sin(a)*d).toFixed(0)}px;animation-delay:${(Math.random()*.25).toFixed(2)}s`;
    el.innerHTML=HEART;
    burstLayer.appendChild(el);
    setTimeout(()=>el.remove(),2000);
  }
}

/* ---------- Mensaje con efecto máquina de escribir ---------- */
function typeLetter(txt){
  clearInterval(tw);
  // El texto restante va invisible para reservar el espacio y que la escena no se mueva al escribir
  const typed=document.createElement('span'), rest=document.createElement('span');
  rest.style.visibility='hidden'; rest.textContent=txt;
  letter.replaceChildren(typed,rest);
  let i=0;
  setTimeout(()=>{
    tw=setInterval(()=>{
      i++;
      typed.textContent=txt.slice(0,i);
      rest.textContent=txt.slice(i);
      if(i>=txt.length){ clearInterval(tw); again.classList.add('on'); }
    },30);
  },3200);
}

/* ---------- Volver a ver ---------- */
again.addEventListener('click',()=>{
  clearInterval(tw);
  scene.classList.remove('show');
  card.classList.remove('hide');
  digits=''; busy=false; attempts=0; hint.textContent=''; render();
  setTimeout(()=>{ bq.innerHTML=''; letter.textContent=''; again.classList.remove('on'); },1100);
});

/* =====================================================
   RAMO DE FLORES (SVG generado)
   ===================================================== */
function rng(seed){
  return function(){
    seed|=0; seed=seed+0x6D2B79F5|0;
    let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}

const flower={
  rose(s,o){
    let g=`<circle r="${s}" fill="${o.b}" stroke="${o.l}" stroke-width="1"/>`;
    for(let i=0;i<5;i++) g+=`<ellipse cy="${-s*.45}" rx="${s*.55}" ry="${s*.6}" transform="rotate(${i*72})" fill="${o.a}" stroke="${o.l}" stroke-width="1"/>`;
    g+=`<circle r="${s*.55}" fill="${o.b}" stroke="${o.l}" stroke-width=".8"/>`;
    for(let i=0;i<4;i++) g+=`<ellipse cy="${-s*.2}" rx="${s*.3}" ry="${s*.38}" transform="rotate(${i*90+30})" fill="${o.a}" stroke="${o.l}" stroke-width=".8"/>`;
    g+=`<circle r="${s*.2}" fill="${o.b}"/>`;
    g+=`<path d="M0 ${s*.05} C${s*.2} ${-s*.05} ${s*.12} ${-s*.3} ${-s*.05} ${-s*.22} S${-s*.3} ${s*.05} ${-s*.1} ${s*.28}" fill="none" stroke="${o.l}" stroke-width="1.1" stroke-linecap="round"/>`;
    return g;
  },
  daisy(s){
    let g='';
    for(let i=0;i<14;i++) g+=`<ellipse cy="${-s*.62}" rx="${s*.17}" ry="${s*.4}" transform="rotate(${i*360/14})" fill="#fff" stroke="#d3e3fb" stroke-width=".8"/>`;
    g+=`<circle r="${s*.3}" fill="#ffd95a" stroke="#f0b400" stroke-width=".8"/><circle r="${s*.14}" fill="#f6b800" opacity=".6"/>`;
    return g;
  },
  tulip(s,o){
    const w=s*.7,h=s*.9;
    const L=`M0 ${h*.75} C${-w*1.25} ${h*.55} ${-w*1.15} ${-h*.5} ${-w*.8} ${-h*1.1} C${-w*.4} ${-h*.7} ${-w*.2} ${-h*.3} 0 ${-h*.2}Z`;
    const R=`M0 ${h*.75} C${w*1.25} ${h*.55} ${w*1.15} ${-h*.5} ${w*.8} ${-h*1.1} C${w*.4} ${-h*.7} ${w*.2} ${-h*.3} 0 ${-h*.2}Z`;
    const C=`M0 ${h*.75} C${-w*.7} ${h*.4} ${-w*.55} ${-h*.7} 0 ${-h*1.25} C${w*.55} ${-h*.7} ${w*.7} ${h*.4} 0 ${h*.75}Z`;
    return `<path d="${L}" fill="${o.c2}" stroke="${o.l}" stroke-width="1"/><path d="${R}" fill="${o.c2}" stroke="${o.l}" stroke-width="1"/><path d="${C}" fill="${o.c}" stroke="${o.l}" stroke-width="1"/>`;
  },
  ger(s,o){
    let g='';
    for(let i=0;i<24;i++) g+=`<ellipse cy="${-s*.62}" rx="${s*.09}" ry="${s*.4}" transform="rotate(${i*15})" fill="${o.c}"/>`;
    for(let i=0;i<18;i++) g+=`<ellipse cy="${-s*.5}" rx="${s*.08}" ry="${s*.3}" transform="rotate(${i*20+8})" fill="${o.c2}"/>`;
    g+=`<circle r="${s*.28}" fill="#0d1b3a"/><circle r="${s*.18}" fill="#1f3a73"/>`;
    for(let i=0;i<7;i++){const a=i*51.4*Math.PI/180; g+=`<circle cx="${Math.cos(a)*s*.1}" cy="${Math.sin(a)*s*.1}" r="${s*.025}" fill="#ffd95a"/>`;}
    return g;
  },
  hyd(s,o,r){
    let g=`<circle r="${s*.88}" fill="${o.c[2]}" opacity=".85"/>`;
    for(let i=0;i<30;i++){
      const a=r()*6.283, rr=Math.sqrt(r())*s*.85, x=Math.cos(a)*rr, y=Math.sin(a)*rr*.95, p=s*.13, col=o.c[Math.floor(r()*3)];
      g+=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle cx="${p}" r="${p}" fill="${col}"/><circle cx="${-p}" r="${p}" fill="${col}"/><circle cy="${p}" r="${p}" fill="${col}"/><circle cy="${-p}" r="${p}" fill="${col}"/><circle r="${p*.55}" fill="${o.c[3]}"/></g>`;
    }
    return g;
  },
  bud(s){
    return `<circle r="${s}" fill="#c6ec9b" stroke="#8fcf6c" stroke-width="1"/>
      <path d="M${-s*.7} ${-s*.1} Q0 ${s*.9} ${s*.7} ${-s*.1}" fill="none" stroke="#8fcf6c" stroke-width="1.2"/>
      <path d="M0 ${-s} Q${-s*.4} 0 0 ${s*.8}" fill="none" stroke="#8fcf6c" stroke-width="1"/>
      <circle cx="${-s*.3}" cy="${-s*.35}" r="${s*.25}" fill="#e3f7c9" opacity=".8"/>`;
  }
};

function buildBouquet(){
  const R=rng(11);
  const BX=200, BY=430;
  let back='', stems='', heads='', spikes='', delay=1.0;

  const stem=(x,y,d,col='#3f9b6d',w=3)=>{
    const sx=BX+(x-200)*.08, cx=(sx+x)/2+(x-200)*.1, cy=(BY+y)/2+10;
    return `<path class="stem" d="M${sx.toFixed(1)} ${BY} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${x} ${y}" pathLength="1" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" style="animation-delay:${d.toFixed(2)}s"/>`;
  };

  /* eucalipto (fondo) */
  const leafCols=['#7fb59b','#6aa68a','#8fc4aa'];
  const branch=(x,y,d)=>{
    const x0=200,y0=420,cx=(x0+x)/2+(x-200)*.15,cy=(y0+y)/2;
    let s=`<path class="stem" d="M${x0} ${y0} Q${cx} ${cy} ${x} ${y}" pathLength="1" fill="none" stroke="#5c9c80" stroke-width="2.5" stroke-linecap="round" style="animation-delay:${d}s"/>`;
    const n=9;
    for(let i=1;i<=n;i++){
      const t=i/n*.95+.05;
      const px=(1-t)*(1-t)*x0+2*(1-t)*t*cx+t*t*x, py=(1-t)*(1-t)*y0+2*(1-t)*t*cy+t*t*y;
      const tx=2*(1-t)*(cx-x0)+2*t*(x-cx), ty=2*(1-t)*(cy-y0)+2*t*(y-cy);
      const ang=Math.atan2(ty,tx)*180/Math.PI, side=i%2?1:-1, rx=11-t*3, ry=5.5-t*1.5;
      s+=`<g transform="translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(${(ang+side*48).toFixed(0)})"><ellipse class="pop" cx="${rx}" cy="0" rx="${rx}" ry="${ry}" fill="${leafCols[i%3]}" style="animation-delay:${(d+.5+i*.06).toFixed(2)}s"/></g>`;
    }
    return s;
  };
  [[45,215],[70,100],[200,28],[330,100],[355,215]].forEach((p,i)=>{ back+=branch(p[0],p[1],.3+i*.12); });

  /* hojas grandes */
  const bigLeaf=(x,y,rot,len,d)=>`<g transform="translate(${x} ${y}) rotate(${rot})"><path class="pop" d="M0 0 C${len*.3} ${-len*.35} ${len*.8} ${-len*.3} ${len} 0 C${len*.8} ${len*.3} ${len*.3} ${len*.35} 0 0Z" fill="url(#lf)" stroke="#2f8a5c" stroke-width="1" style="animation-delay:${d}s;transform-origin:left center"/><path d="M0 0 L${len*.9} 0" stroke="#2f8a5c" stroke-width="1" opacity=".5"/></g>`;
  back+=bigLeaf(150,330,-140,75,.9)+bigLeaf(250,330,-40,75,1.0)+bigLeaf(120,335,-165,70,1.1)+bigLeaf(280,335,-15,70,1.2);

  /* flores: tipo, x, y, tamaño, opciones */
  const BL=['#8fb8ff','#b9d3ff','#6a9bf0','#e3eeff'];
  const F=[
    ['hyd',105,225,46,{c:BL}],
    ['hyd',297,222,44,{c:['#a7c7ff','#cfe0ff','#7aa6f2','#ffffff']}],
    ['hyd',208,108,38,{c:BL}],
    ['tulip',140,150,32,{c:'#ffffff',c2:'#d4e4ff',l:'#a9c4ee'}],
    ['tulip',266,146,32,{c:'#74a9ff',c2:'#3b78e0',l:'#2c5fb8'}],
    ['ger',200,165,40,{c:'#4d92ff',c2:'#9ec6ff'}],
    ['rose',152,238,36,{a:'#ffffff',b:'#e2edff',l:'#aac3ec'}],
    ['rose',250,240,36,{a:'#bcd8ff',b:'#70a8ff',l:'#3f78d6'}],
    ['rose',201,262,30,{a:'#ffffff',b:'#e2edff',l:'#aac3ec'}],
    ['daisy',100,165,18],['daisy',305,165,18],['daisy',175,112,16],['daisy',240,100,16],
    ['daisy',60,258,17],['daisy',342,255,17],['daisy',120,268,15],['daisy',285,268,15],
    ['bud',160,190,13],['bud',250,185,13],['bud',60,195,12],['bud',345,190,12],
    ['bud',200,52,12],['bud',320,110,11],['bud',82,112,11]
  ];
  F.forEach((f,i)=>{
    const [type,x,y,s,o]=f, d=delay+i*.17;
    stems+=stem(x,y,d-.5,'#3f9b6d',type==='hyd'?4:3);
    const body=type==='hyd'?flower.hyd(s,o,R):flower[type](s,o);
    heads+=`<g transform="translate(${x} ${y})"><g class="pop" style="animation-delay:${d.toFixed(2)}s">${body}</g></g>`;
  });

  /* espigas blancas */
  const spike=(x,y,d)=>{
    const bx=x-(x-200)*.12, by=y+38;
    let s=`<line class="stem" x1="${bx}" y1="${by}" x2="${x}" y2="${y}" pathLength="1" stroke="#6aa68a" stroke-width="2" style="animation-delay:${d}s"/>`;
    for(let i=0;i<8;i++){
      const t=i/7, px=bx+(x-bx)*t, py=by+(y-by)*t, r=3.2-t*1.6;
      s+=`<circle class="pop" cx="${(px+(i%2?2:-2)).toFixed(1)}" cy="${py.toFixed(1)}" r="${r.toFixed(1)}" fill="${i%3===0?'#bcd6ff':'#fff'}" stroke="#cfe0f7" stroke-width=".6" style="animation-delay:${(d+.4+i*.07).toFixed(2)}s"/>`;
    }
    return s;
  };
  [[130,58],[272,62],[40,250],[360,250],[28,160],[372,150]].forEach((p,i)=>{
    stems+=stem(p[0],p[1]+38,.6+i*.1,'#6aa68a',2);
    spikes+=spike(p[0],p[1],1.4+i*.2);
  });

  /* papel de envoltura */
  const paperBack=`<polygon points="200,482 52,296 96,262 200,300 304,262 348,296" fill="#1a2748"/>
    <path d="M52 296 L96 262 L200 300 L304 262 L348 296" fill="none" stroke="#e9f1ff" stroke-width="2.5" stroke-linejoin="round"/>`;
  const paperFront=`<path d="M200 482 L56 300 Q122 312 200 346Z" fill="url(#pl)"/>
    <path d="M200 482 L344 300 Q278 312 200 346Z" fill="url(#pr)"/>
    <path d="M200 346 L200 482" stroke="#fff" stroke-opacity=".1" stroke-width="2"/>
    <path d="M56 300 Q122 312 200 346 Q278 312 344 300" fill="none" stroke="#f4f8ff" stroke-width="3" stroke-linecap="round"/>`;

  /* lazo blanco */
  const bow=`<g class="pop" style="animation-delay:3.2s">
    <path d="M198 394 L176 448 L192 440 L200 456 L206 396Z" fill="#fff" stroke="#c9dcf7"/>
    <path d="M202 394 L224 448 L208 440 L202 456Z" fill="#eaf2ff" stroke="#c9dcf7"/>
    <path d="M200 390 C150 352 138 402 170 412 C190 417 198 400 200 390Z" fill="#fff" stroke="#c9dcf7"/>
    <path d="M200 390 C250 352 262 402 230 412 C210 417 202 400 200 390Z" fill="#f3f8ff" stroke="#c9dcf7"/>
    <ellipse cx="200" cy="392" rx="9" ry="8" fill="#e1ecff" stroke="#b9cdea"/>
  </g>`;

  /* destellos */
  const sp=[[40,80],[360,90],[70,30],[330,40],[200,10],[18,180],[382,170],[150,38],[255,32]];
  const sparks=sp.map((p,i)=>`<path class="spark" d="M0 -6 L1.6 -1.6 L6 0 L1.6 1.6 L0 6 L-1.6 1.6 L-6 0 L-1.6 -1.6Z" transform="translate(${p[0]} ${p[1]})" fill="${i%3===0?'#7fdcb0':i%3===1?'#8ec5ff':'#ffffff'}" stroke="#bcd6ff" stroke-width=".4" style="animation-delay:${(3+i*.35).toFixed(2)}s"/>`).join('');

  bq.innerHTML=`
    <defs>
      <linearGradient id="lf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3f9b6d"/><stop offset="1" stop-color="#7fd0a3"/></linearGradient>
      <linearGradient id="pl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1224"/><stop offset="1" stop-color="#1b2a4a"/></linearGradient>
      <linearGradient id="pr" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15213f"/><stop offset="1" stop-color="#0a0f1e"/></linearGradient>
    </defs>
    <g class="sway">
      <g class="rise">${paperBack}</g>
      ${back}${stems}${heads}${spikes}
      <g class="rise">${paperFront}</g>
      ${bow}
    </g>
    ${sparks}`;
}

render();
</script>
</body>
</html>
